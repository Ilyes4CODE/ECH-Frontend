<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-title="om_title">Ordres de mission — ECH SAHARA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="content">
      <div class="page-head">
        <div>
          <h2 data-i18n="om_title">Ordres de mission</h2>
          <p class="sub" data-i18n="om_subtitle">Gestion des déplacements</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="showOM()"><i class="fas fa-plus"></i> <span data-i18n="om_new">Nouvelle mission</span></button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-row">
          <div><div class="stat-label" data-i18n="om_title">Total</div><div class="stat-value" id="s-total">—</div></div>
          <div class="stat-icon primary"><i class="fas fa-plane-departure"></i></div>
        </div></div>
        <div class="stat"><div class="stat-row">
          <div><div class="stat-label">Ce mois</div><div class="stat-value" id="s-month">—</div></div>
          <div class="stat-icon warning"><i class="fas fa-calendar-days"></i></div>
        </div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3 data-i18n="om_title">Liste</h3>
          <div class="filter-bar" style="margin:0;flex-wrap:wrap;">
            <div class="input-icon" style="min-width:200px;">
              <i class="fas fa-search"></i>
              <input class="input" id="f-search" data-i18n-ph="btn_search" oninput="applyFilters()" placeholder="N°, nom, destination, motif...">
            </div>
            <input type="date" class="input" id="f-from" style="width:160px;" onchange="applyFilters()" title="Départ après">
            <input type="date" class="input" id="f-to" style="width:160px;" onchange="applyFilters()" title="Départ avant">
            <button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i class="fas fa-rotate-left"></i> <span data-i18n="btn_clear">Effacer</span></button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="table">
            <thead><tr>
              <th data-i18n="om_numero">N°</th>
              <th data-i18n="om_nom">Nom</th>
              <th data-i18n="om_destination">Destination</th>
              <th data-i18n="om_depart">Départ</th>
              <th data-i18n="om_retour">Retour</th>
              <th data-i18n="lbl_actions">Actions</th>
            </tr></thead>
            <tbody id="omBody"><tr><td colspan="6"><div class="loader-wrap"><div class="loader"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
let omList = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!UI.init('nav_missions','om_title')) return;
  I18n.init();
  await loadOM();
});

async function loadOM() {
  const tb = document.getElementById('omBody');
  tb.innerHTML = `<tr><td colspan="6"><div class="loader-wrap"><div class="loader"></div></div></td></tr>`;
  try {
    omList = await Auth.get(CFG.R.MISSIONS);
    const m = new Date().toISOString().slice(0,7);
    document.getElementById('s-total').textContent = omList.length;
    document.getElementById('s-month').textContent = omList.filter(o => (o.date_depart||'').startsWith(m)).length;
    applyFilters();
  } catch { tb.innerHTML = UI.emptyRow(6, 'fa-circle-exclamation', 'err_load'); }
}

function applyFilters() {
  const q    = (document.getElementById('f-search')?.value||'').toLowerCase().trim();
  const from = document.getElementById('f-from')?.value;
  const to   = document.getElementById('f-to')?.value;
  const filtered = omList.filter(o => {
    if (q) {
      const hay = [
        o.numero||'', o.nom_prenom||'', o.fonction||'', o.destination||'',
        o.motif||'', o.matricule||'', o.matricule_2||'', o.accompagne_par||''
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    const d = (o.date_depart||'').slice(0,10);
    if (from && d && d < from) return false;
    if (to   && d && d > to)   return false;
    return true;
  });
  render(filtered);
}

function resetFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  applyFilters();
}

function render(list) {
  const tb = document.getElementById('omBody');
  list = list || omList;
  if (!list.length) { tb.innerHTML = UI.emptyRow(6, 'fa-plane-departure'); return; }
  tb.innerHTML = list.map(o => `<tr>
    <td><span class="fw-600">${escapeHtml(o.numero||'—')}</span></td>
    <td>${escapeHtml(o.nom_prenom||'—')}</td>
    <td>${escapeHtml(o.destination||'—')}</td>
    <td style="color:var(--c-text-2);">${UI.fmtDate(o.date_depart)}</td>
    <td style="color:var(--c-text-2);">${o.date_retour?UI.fmtDate(o.date_retour):'—'}</td>
    <td><div class="table-actions">
      <button class="btn btn-ghost btn-sm" onclick="downloadPDF(${o.id})"><i class="fas fa-file-pdf text-danger"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="showOM(${o.id})"><i class="fas fa-pen"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="del(${o.id})" style="color:var(--c-danger);"><i class="fas fa-trash"></i></button>
    </div></td>
  </tr>`).join('');
}

function escapeHtml(s) { return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return (s||'').toString().replace(/"/g,'&quot;'); }

async function showOM(id = null) {
  const o = id ? omList.find(x=>x.id===id) : null;
  const v = (k) => escapeAttr(o?.[k] || '');
  const data = await UI.formModal({
    titleKey: id?'btn_edit':'om_new', width:680,
    html: `<div class="swal-form">
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('om_nom')} <span class="req">*</span></label>
          <input class="input" name="nom_prenom" required value="${v('nom_prenom')}"></div>
        <div class="field"><label class="label">${I18n.t('om_fonction')} <span class="req">*</span></label>
          <input class="input" name="fonction" required value="${v('fonction')}"></div>
      </div>
      <div class="field"><label class="label">${I18n.t('om_adresse')} <span class="req">*</span></label>
        <input class="input" name="adresse" required value="${v('adresse')}"></div>
      <div class="field"><label class="label">${I18n.t('om_destination')} <span class="req">*</span></label>
        <input class="input" name="destination" required value="${v('destination')}"></div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('om_matricule')} <span class="req">*</span></label>
          <input class="input" name="matricule" required value="${v('matricule')}"></div>
        <div class="field"><label class="label">${I18n.t('om_matricule2')}</label>
          <input class="input" name="matricule_2" value="${v('matricule_2')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('om_depart')} <span class="req">*</span></label>
          <input class="input" type="date" name="date_depart" required value="${v('date_depart')}"></div>
        <div class="field"><label class="label">${I18n.t('om_retour')}</label>
          <input class="input" type="date" name="date_retour" value="${v('date_retour')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('om_moyen')} <span class="req">*</span></label>
          <input class="input" name="moyen_deplacement" required value="${v('moyen_deplacement')}"></div>
        <div class="field"><label class="label">${I18n.t('om_accompagne')}</label>
          <input class="input" name="accompagne_par" value="${v('accompagne_par')}"></div>
      </div>
      <div class="field"><label class="label">${I18n.t('om_motif')} <span class="req">*</span></label>
        <textarea class="textarea" name="motif" rows="2" required>${escapeHtml(o?.motif||'')}</textarea></div>
    </div>`,
    preConfirm: (d) => ({
      nom_prenom: d.nom_prenom,
      fonction: d.fonction,
      adresse: d.adresse,
      destination: d.destination,
      matricule: d.matricule,
      matricule_2: d.matricule_2 || '',
      date_depart: d.date_depart,
      date_retour: d.date_retour || null,
      moyen_deplacement: d.moyen_deplacement,
      accompagne_par: d.accompagne_par || '',
      motif: d.motif
    })
  });
  if (!data) return;
  const r = id ? await Auth.put(CFG.R.MISSION_UPDATE(id), data) : await Auth.post(CFG.R.MISSION_CREATE, data);
  if (r?.ok) { UI.ok(I18n.t(id?'om_success_update':'om_success_create')); await loadOM(); }
  else await UI.apiErr(r);
}

async function downloadPDF(id) { try { await Auth.download(CFG.R.MISSION_PDF(id)); } catch { UI.err(I18n.t('err_load')); } }
async function del(id) {
  if (!await UI.confirmDelete()) return;
  const r = await Auth.del(CFG.R.MISSION_DELETE(id));
  if (r?.ok) { UI.ok(I18n.t('btn_delete')+' ✓'); await loadOM(); } else await UI.apiErr(r);
}
</script>
</body>
</html>

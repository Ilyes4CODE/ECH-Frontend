<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-title="prof_title">Profil — ECH SAHARA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="content" style="max-width:880px;">
      <div class="page-head">
        <div>
          <h2 data-i18n="prof_title">Mon profil</h2>
          <p class="sub" data-i18n="prof_subtitle">Vos informations personnelles</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;overflow:hidden;">
        <div style="height:110px;background:linear-gradient(135deg, var(--c-primary) 0%, var(--c-primary-2) 100%);position:relative;"></div>
        <div style="padding:0 24px 24px;">
          <div style="display:flex;align-items:flex-end;gap:20px;margin-top:-50px;margin-bottom:16px;flex-wrap:wrap;">
            <div style="position:relative;">
              <div id="avatarWrap" style="width:100px;height:100px;border-radius:50%;border:4px solid #fff;background:linear-gradient(135deg, var(--c-primary-3), var(--c-primary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:700;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
                <span id="avatarLetter">U</span>
              </div>
              <button class="btn btn-accent btn-icon btn-sm" style="position:absolute;bottom:0;right:0;border-radius:50%;width:30px;height:30px;" onclick="document.getElementById('avatarInput').click()">
                <i class="fas fa-camera"></i>
              </button>
              <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
            </div>
            <div style="flex:1;min-width:200px;">
              <h3 id="pName" style="font-size:20px;font-weight:700;color:var(--c-text);margin-bottom:6px;">—</h3>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span id="pRole" class="badge primary">—</span>
                <span id="pStatus" class="badge success">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-2" style="margin-bottom:20px;">
        <div class="card"><div class="card-body">
          <div class="stat-label" data-i18n="usr_username">Nom d'utilisateur</div>
          <div id="pUsername" style="font-size:15px;font-weight:600;color:var(--c-text);margin-top:6px;">—</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="stat-label" data-i18n="prof_fullname">Nom complet</div>
          <div id="pFullname" style="font-size:15px;font-weight:600;color:var(--c-text);margin-top:6px;">—</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="stat-label" data-i18n="prof_role">Rôle</div>
          <div id="pRoleText" style="font-size:15px;font-weight:600;color:var(--c-text);margin-top:6px;">—</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="stat-label" data-i18n="lbl_status">Statut</div>
          <div id="pStatusText" style="font-size:15px;font-weight:600;color:var(--c-text);margin-top:6px;">—</div>
        </div></div>
      </div>

      <div class="card">
        <div class="card-head"><h3 data-i18n="prof_edit">Modifier le profil</h3></div>
        <div class="card-body">
          <form id="profForm">
            <div class="form-row cols-2">
              <div class="field"><label class="label" data-i18n="usr_first_name">Prénom</label>
                <input class="input" id="firstName"></div>
              <div class="field"><label class="label" data-i18n="usr_last_name">Nom</label>
                <input class="input" id="lastName"></div>
            </div>
            <div class="field">
              <label class="label" data-i18n="prof_new_pwd">Nouveau mot de passe</label>
              <div style="position:relative;">
                <input type="password" class="input" id="newPwd" placeholder="••••••••" style="padding-right:40px;">
                <button type="button" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--c-text-3);padding:6px;" onclick="togglePwd(this)"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> <span data-i18n="btn_save">Enregistrer</span></button>
              <button type="button" class="btn btn-ghost" onclick="loadProfile()" data-i18n="btn_cancel">Annuler</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!UI.init('nav_profile','prof_title')) return;
  I18n.init();
  await loadProfile();
});

async function loadProfile() {
  try {
    const d = await Auth.get(CFG.R.PROFILE);
    const full = ((d.first_name||'')+' '+(d.last_name||'')).trim() || d.username || '';
    document.getElementById('pName').textContent     = full || '—';
    document.getElementById('pUsername').textContent = d.username || '—';
    document.getElementById('pFullname').textContent = full || '—';
    document.getElementById('pRoleText').textContent = (d.groups||[]).join(', ') || '—';
    document.getElementById('pRole').textContent     = (d.groups||[])[0] || '—';
    document.getElementById('avatarLetter').textContent = (d.username||'U').charAt(0).toUpperCase();
    const active = d.is_active !== false;
    document.getElementById('pStatus').textContent     = active ? I18n.t('lbl_active') : I18n.t('lbl_inactive');
    document.getElementById('pStatus').className       = 'badge ' + (active ? 'success' : 'danger');
    document.getElementById('pStatusText').textContent = active ? I18n.t('lbl_active') : I18n.t('lbl_inactive');
    document.getElementById('firstName').value = d.first_name || '';
    document.getElementById('lastName').value  = d.last_name  || '';
    if (d.profile_picture) {
      const img = document.getElementById('avatarImg');
      img.src = d.profile_picture.startsWith('http') ? d.profile_picture : CFG.API + d.profile_picture;
      img.style.display = 'block';
      document.getElementById('avatarLetter').style.display = 'none';
    }
  } catch { UI.err(I18n.t('err_load')); }
}

document.getElementById('profForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    first_name: document.getElementById('firstName').value,
    last_name:  document.getElementById('lastName').value,
  };
  const pwd = document.getElementById('newPwd').value;
  if (pwd) body.password = pwd;
  const r = await Auth.put(CFG.R.PROFILE_UPDATE, body);
  if (r?.ok) { UI.ok(I18n.t('prof_success')); document.getElementById('newPwd').value=''; await loadProfile(); }
  else await UI.apiErr(r);
});

async function uploadAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('profile_picture', file);
  const r = await Auth.put(CFG.R.PROFILE_UPDATE, fd, true);
  if (r?.ok) { UI.ok(I18n.t('prof_success')); await loadProfile(); }
  else await UI.apiErr(r);
}

function togglePwd(btn) {
  const inp = btn.previousElementSibling;
  const i = btn.querySelector('i');
  if (inp.type==='password') { inp.type='text'; i.className='fas fa-eye-slash'; }
  else { inp.type='password'; i.className='fas fa-eye'; }
}
</script>
</body>
</html>

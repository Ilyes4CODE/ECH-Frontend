<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — ECH SAHARA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px; }
  .e-icon { width:120px;height:120px;border-radius:32px;background:linear-gradient(135deg,#1E3A8A,#1E40AF);display:flex;align-items:center;justify-content:center;margin-bottom:32px;box-shadow:0 20px 40px rgba(30,58,138,.3); }
  .e-icon i { font-size:48px;color:#fff; }
  .e-num { font-size:96px;font-weight:800;color:var(--c-primary);opacity:.1;line-height:1;margin-bottom:-16px;letter-spacing:-.04em; }
  h1 { font-size:28px;font-weight:700;color:var(--c-text);margin-bottom:8px; }
  p { color:var(--c-text-2);font-size:15px;max-width:420px;text-align:center;margin-bottom:32px;line-height:1.6; }
  .bar { width:240px;height:4px;background:var(--c-border);border-radius:99px;margin-bottom:24px;overflow:hidden; }
  .bar > div { height:100%;background:var(--c-accent);border-radius:99px;width:0; }
  .lang-row { position:fixed;top:20px;right:20px; }
  [dir="rtl"] .lang-row { right:auto;left:20px; }
  .brand-foot { position:fixed;bottom:20px;display:flex;align-items:center;gap:8px;color:var(--c-text-3);font-size:12.5px; }
  .brand-foot .b { width:28px;height:28px;border-radius:8px;background:var(--c-accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px; }
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
  .floating { animation: float 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="lang-row">
  <div class="lang-pill">
    <button class="active" data-lang-btn="fr" onclick="setL('fr')">FR</button>
    <button data-lang-btn="ar" onclick="setL('ar')">ع</button>
  </div>
</div>

<div class="e-icon floating"><i class="fas fa-map-location-dot"></i></div>
<div class="e-num">404</div>
<h1 id="t-title" data-i18n="e404_title">Page introuvable</h1>
<p id="t-desc" data-i18n="e404_desc">La page demandée n'existe pas ou a été déplacée.</p>
<div class="bar"><div id="prog"></div></div>
<div style="display:flex;gap:10px;">
  <a href="dashboard.html" class="btn btn-primary"><i class="fas fa-home"></i> <span data-i18n="e404_btn">Tableau de bord</span></a>
  <button onclick="history.back()" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> <span data-i18n="btn_back">Retour</span></button>
</div>

<div class="brand-foot">
  <div class="b"><i class="fas fa-hard-hat"></i></div>
  <span>ECH SAHARA ERP</span>
</div>

<script src="js/i18n.js"></script>
<script>
function setL(l) { I18n.setLang(l); }
I18n.init();

let p = 0;
const bar = document.getElementById('prog');
const iv = setInterval(() => {
  p += 100/80;
  bar.style.width = Math.min(p, 100) + '%';
  if (p >= 100) { clearInterval(iv); location.href = localStorage.getItem('access_token') ? 'dashboard.html' : 'login.html'; }
}, 100);
</script>
</body>
</html>

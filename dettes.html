<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-title="det_title">Dettes — ECH SAHARA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/app.css">
<style>
  .tab-btn { padding:6px 12px;border:1px solid var(--c-border);background:var(--c-surface);border-radius:8px;font-size:12.5px;font-weight:500;color:var(--c-text-2);cursor:pointer;transition:all .15s;font-family:inherit; }
  .tab-btn.active { background:var(--c-primary);color:#fff;border-color:var(--c-primary); }
  .progress { height:6px;background:var(--c-surface-2);border-radius:999px;overflow:hidden;width:100px; }
  .progress > div { height:100%;border-radius:999px;transition:width .3s; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="content">
      <div class="page-head">
        <div>
          <h2 data-i18n="det_title">Dettes</h2>
          <p class="sub" data-i18n="det_subtitle">Gestion des dettes</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="showNew()"><i class="fas fa-plus"></i> <span data-i18n="det_new">Nouvelle dette</span></button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-row">
          <div><div class="stat-label" data-i18n="det_title">Total</div><div class="stat-value" id="s-total">—</div></div>
          <div class="stat-icon primary"><i class="fas fa-hand-holding-dollar"></i></div>
        </div></div>
        <div class="stat"><div class="stat-row">
          <div><div class="stat-label" data-i18n="det_remaining">Restant</div><div class="stat-value text-danger" id="s-rem">—</div></div>
          <div class="stat-icon danger"><i class="fas fa-clock"></i></div>
        </div></div>
        <div class="stat"><div class="stat-row">
          <div><div class="stat-label" data-i18n="det_active">En cours</div><div class="stat-value" id="s-active">—</div></div>
          <div class="stat-icon warning"><i class="fas fa-hourglass-half"></i></div>
        </div></div>
        <div class="stat"><div class="stat-row">
          <div><div class="stat-label" data-i18n="det_completed">Soldées</div><div class="stat-value text-success" id="s-done">—</div></div>
          <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
        </div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div style="display:flex;gap:8px;">
            <button class="tab-btn active" data-flt="" onclick="setFilter(this,'')" data-i18n="det_filter_all">Toutes</button>
            <button class="tab-btn" data-flt="active" onclick="setFilter(this,'active')" data-i18n="det_filter_active">Actives</button>
            <button class="tab-btn" data-flt="completed" onclick="setFilter(this,'completed')" data-i18n="det_filter_completed">Soldées</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="table">
            <thead><tr>
              <th data-i18n="det_creditor">Créancier</th>
              <th data-i18n="det_original">Initial</th>
              <th data-i18n="det_remaining">Restant</th>
              <th data-i18n="lbl_project">Projet</th>
              <th data-i18n="det_status">Statut</th>
              <th data-i18n="lbl_date">Date</th>
              <th data-i18n="lbl_actions">Actions</th>
            </tr></thead>
            <tbody id="dBody"><tr><td colspan="7"><div class="loader-wrap"><div class="loader"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
let dList = [], projects = [], curFilter = '';

document.addEventListener('DOMContentLoaded', async () => {
  if (!UI.init('nav_dettes','det_title')) return;
  I18n.init();
  projects = await Auth.get(CFG.R.PROJECTS).catch(()=>[]);
  await loadD();
});

async function loadD() {
  const tb = document.getElementById('dBody');
  tb.innerHTML = `<tr><td colspan="7"><div class="loader-wrap"><div class="loader"></div></div></td></tr>`;
  try {
    let url = CFG.R.DETTES;
    if (curFilter) url += '?status=' + curFilter;
    dList = await Auth.get(url);
    document.getElementById('s-total').textContent  = dList.length;
    document.getElementById('s-active').textContent = dList.filter(d=>d.status==='active').length;
    document.getElementById('s-done').textContent   = dList.filter(d=>d.status==='completed').length;
    const rem = dList.reduce((s,d)=>s+parseFloat(d.remaining_amount||0),0);
    document.getElementById('s-rem').textContent = UI.fmtAmount(rem);
    render();
  } catch { tb.innerHTML = UI.emptyRow(7, 'fa-circle-exclamation', 'err_load'); }
}

function render() {
  const tb = document.getElementById('dBody');
  if (!dList.length) { tb.innerHTML = UI.emptyRow(7, 'fa-hand-holding-dollar'); return; }
  tb.innerHTML = dList.map(d => {
    const active = d.status==='active';
    const pct = d.original_amount > 0 ? Math.round((1 - d.remaining_amount/d.original_amount)*100) : 100;
    const barColor = active ? 'var(--c-warning)' : 'var(--c-success)';
    return `<tr>
      <td><span class="fw-600">${escapeHtml(d.creditor_name)}</span></td>
      <td>${UI.fmtAmount(d.original_amount)}</td>
      <td>
        <div class="fw-600">${UI.fmtAmount(d.remaining_amount)}</div>
        <div class="progress" style="margin-top:4px;"><div style="width:${pct}%;background:${barColor};"></div></div>
      </td>
      <td>${escapeHtml(d.project_name||'—')}</td>
      <td><span class="badge ${active?'warning':'success'}">${active?I18n.t('det_active'):I18n.t('det_completed')}</span></td>
      <td style="color:var(--c-text-2);">${UI.fmtDate(d.date_created)}</td>
      <td><div class="table-actions">
        ${active?`<button class="btn btn-ghost btn-sm" onclick="showPay(${d.id},'${escapeAttr(d.creditor_name)}',${d.remaining_amount})" style="color:var(--c-success);"><i class="fas fa-money-bill-wave"></i></button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="downloadPDF(${d.id})"><i class="fas fa-file-pdf text-danger"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="showDetails(${d.id})"><i class="fas fa-eye text-primary"></i></button>
      </div></td>
    </tr>`;
  }).join('');
}

function escapeHtml(s) { return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return (s||'').toString().replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function setFilter(btn, f) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curFilter = f;
  loadD();
}

async function showNew() {
  const projOpts = projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const data = await UI.formModal({
    titleKey:'det_new', width:520,
    html: `<div class="swal-form">
      <div class="field"><label class="label">${I18n.t('det_creditor')} <span class="req">*</span></label>
        <input class="input" name="creditor_name" required></div>
      <div class="field"><label class="label">${I18n.t('det_original')} <span class="req">*</span></label>
        <input class="input" type="number" name="original_amount" min="0.01" step="0.01" required></div>
      <div class="field"><label class="label">${I18n.t('lbl_description')}</label>
        <textarea class="textarea" name="description" rows="2"></textarea></div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('lbl_project')}</label>
          <select class="select" name="project_id"><option value="">—</option>${projOpts}</select></div>
        <div class="field"><label class="label">${I18n.t('lbl_date')}</label>
          <input class="input" type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
    </div>`,
    preConfirm: (d) => {
      const body = {
        creditor_name: d.creditor_name,
        original_amount: parseFloat(d.original_amount),
        description: d.description||'',
        date: d.date || new Date().toISOString().slice(0,10)
      };
      if (d.project_id) body.project_id = parseInt(d.project_id);
      return body;
    }
  });
  if (!data) return;
  const r = await Auth.post(CFG.R.DETTE_CREATE, data);
  if (r?.ok) { UI.ok(I18n.t('det_success_create')); await loadD(); }
  else await UI.apiErr(r);
}

async function showPay(id, creditor, maxAmt) {
  const data = await UI.formModal({
    titleKey:'det_pay', width:520,
    html: `<div class="swal-form">
      <div style="background:var(--c-info-bg);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px;color:var(--c-info);">
        ${creditor} — ${I18n.t('det_remaining')}: <strong>${UI.fmtAmount(maxAmt)}</strong>
      </div>
      <div class="field"><label class="label">${I18n.t('det_payment_amount')} <span class="req">*</span></label>
        <input class="input" type="number" name="amount_paid" min="0.01" step="0.01" max="${maxAmt}" required></div>
      <div class="field"><label class="label">${I18n.t('det_payment_mode')}</label>
        <select class="select" name="mode_paiement" onchange="togglePM(this.value)">
          <option value="especes">${I18n.t('caisse_mode_especes')}</option>
          <option value="cheque">${I18n.t('caisse_mode_cheque')}</option>
          <option value="virement">${I18n.t('caisse_mode_virement')}</option>
        </select></div>
      <div class="form-row cols-2" id="pm-extra" style="display:none;">
        <div class="field"><label class="label">${I18n.t('caisse_fournisseur')}</label><input class="input" name="nom_fournisseur"></div>
        <div class="field"><label class="label" id="pm-lbl">${I18n.t('caisse_cheque')}</label><input class="input" name="bank_ref"></div>
      </div>
      <div class="field"><label class="label">${I18n.t('lbl_description')}</label>
        <textarea class="textarea" name="description" rows="2"></textarea></div>
    </div>`,
    preConfirm: (d) => {
      const body = {
        amount_paid: parseFloat(d.amount_paid),
        mode_paiement: d.mode_paiement,
        description: d.description||''
      };
      if (d.nom_fournisseur) body.nom_fournisseur = d.nom_fournisseur;
      if (d.mode_paiement==='cheque') body.numero_cheque = d.bank_ref;
      if (d.mode_paiement==='virement') body.banque = d.bank_ref;
      return body;
    }
  });
  if (!data) return;
  const r = await Auth.post(CFG.R.DETTE_PAYMENT(id), data);
  if (r?.ok) { UI.ok(I18n.t('det_success_payment')); await loadD(); }
  else await UI.apiErr(r);
}

function togglePM(m) {
  const w = document.getElementById('pm-extra');
  if (w) w.style.display = m==='especes' ? 'none' : 'grid';
  const l = document.getElementById('pm-lbl');
  if (l) l.textContent = m==='cheque' ? I18n.t('caisse_cheque') : I18n.t('caisse_banque');
}

async function showDetails(id) {
  try {
    const d = await Auth.get(CFG.R.DETTE(id));
    const pmts = d.payments || [];
    const rows = pmts.length ? pmts.map(p => `<tr>
      <td>${UI.fmtDate(p.payment_date)}</td>
      <td class="fw-600 text-success">${UI.fmtAmount(p.amount_paid)}</td>
      <td><span class="badge muted">${p.mode_paiement||'—'}</span></td>
      <td style="color:var(--c-text-2);font-size:12.5px;">${escapeHtml(p.description||'—')}</td>
    </tr>`).join('') : `<tr><td colspan="4" style="padding:30px;text-align:center;color:var(--c-text-3);">${I18n.t('det_no_payments')}</td></tr>`;
    await Swal.fire({
      title: d.creditor_name + ' — ' + I18n.t('det_payments'),
      html: `<div class="table-scroll"><table class="table" style="font-size:12.5px;">
        <thead><tr><th>${I18n.t('lbl_date')}</th><th>${I18n.t('det_payment_amount')}</th><th>${I18n.t('det_payment_mode')}</th><th>${I18n.t('lbl_description')}</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`,
      width: 640,
      showConfirmButton: false,
      showCloseButton: true
    });
  } catch { UI.err(I18n.t('err_load')); }
}

async function downloadPDF(id) { try { await Auth.download(CFG.R.DETTE_PDF(id)); } catch { UI.err(I18n.t('err_load')); } }
</script>
</body>
</html>

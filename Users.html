<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-title="usr_title">Utilisateurs — ECH SAHARA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="content">
      <div class="page-head">
        <div>
          <h2 data-i18n="usr_title">Utilisateurs</h2>
          <p class="sub" data-i18n="usr_subtitle">Gestion des comptes</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="showCreate()"><i class="fas fa-user-plus"></i> <span data-i18n="usr_new">Nouvel utilisateur</span></button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-row">
            <div><div class="stat-label" data-i18n="usr_total">Total</div><div class="stat-value" id="s-total">—</div></div>
            <div class="stat-icon primary"><i class="fas fa-users"></i></div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-row">
            <div><div class="stat-label" data-i18n="usr_active">Actifs</div><div class="stat-value" id="s-active">—</div></div>
            <div class="stat-icon success"><i class="fas fa-user-check"></i></div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-row">
            <div><div class="stat-label" data-i18n="usr_admins">Admins</div><div class="stat-value" id="s-admins">—</div></div>
            <div class="stat-icon warning"><i class="fas fa-user-shield"></i></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3 data-i18n="usr_title">Utilisateurs</h3>
          <div class="filter-bar" style="margin:0;flex-wrap:wrap;">
            <div class="input-icon" style="min-width:220px;">
              <i class="fas fa-search"></i>
              <input class="input" id="f-search" data-i18n-ph="btn_search" oninput="applyFilters()" placeholder="Rechercher...">
            </div>
            <select id="f-group" class="select" style="width:160px;" onchange="applyFilters()">
              <option value="" data-i18n="lbl_all">Tous les rôles</option>
              <option value="Admin">Admin</option>
              <option value="Commercial">Commercial</option>
              <option value="Comptable">Comptable</option>
              <option value="Secrétaire">Secrétaire</option>
            </select>
            <select id="f-status" class="select" style="width:140px;" onchange="applyFilters()">
              <option value="" data-i18n="lbl_all">Tous</option>
              <option value="active" data-i18n="lbl_active">Actif</option>
              <option value="inactive" data-i18n="lbl_inactive">Inactif</option>
            </select>
            <button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i class="fas fa-rotate-left"></i> <span data-i18n="btn_clear">Effacer</span></button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="table">
            <thead><tr>
              <th data-i18n="usr_username">Nom d'utilisateur</th>
              <th data-i18n="prof_fullname">Nom complet</th>
              <th data-i18n="usr_group">Rôle</th>
              <th data-i18n="lbl_status">Statut</th>
              <th data-i18n="lbl_actions">Actions</th>
            </tr></thead>
            <tbody id="usersBody">
              <tr><td colspan="5"><div class="loader-wrap"><div class="loader"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
let usersList = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!UI.init('nav_users','usr_title')) return;
  if (!Auth.isAdmin()) { UI.err(I18n.t('err_forbidden')); setTimeout(()=>location.href='dashboard.html', 1500); return; }
  I18n.init();
  await loadUsers();
});

async function loadUsers() {
  const tb = document.getElementById('usersBody');
  tb.innerHTML = `<tr><td colspan="5"><div class="loader-wrap"><div class="loader"></div></div></td></tr>`;
  try {
    usersList = await Auth.get(CFG.R.USERS);
    document.getElementById('s-total').textContent  = usersList.length;
    document.getElementById('s-active').textContent = usersList.filter(u=>u.is_active!==false).length;
    document.getElementById('s-admins').textContent = usersList.filter(u=>(u.groups||[]).includes('Admin')).length;
    applyFilters();
  } catch { tb.innerHTML = UI.emptyRow(5, 'fa-circle-exclamation', 'err_load'); }
}

function applyFilters() {
  const q   = (document.getElementById('f-search').value||'').toLowerCase().trim();
  const grp = document.getElementById('f-group').value;
  const st  = document.getElementById('f-status').value;
  const filtered = usersList.filter(u => {
    if (grp && !(u.groups||[]).includes(grp)) return false;
    if (st === 'active'   && u.is_active === false) return false;
    if (st === 'inactive' && u.is_active !== false) return false;
    if (q) {
      const hay = [
        u.username||'', u.first_name||'', u.last_name||'',
        u.email||'', (u.groups||[]).join(' ')
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  render(filtered);
}

function resetFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-group').value  = '';
  document.getElementById('f-status').value = '';
  applyFilters();
}

function render(list) {
  const tb = document.getElementById('usersBody');
  list = list || usersList;
  if (!list.length) { tb.innerHTML = UI.emptyRow(5, 'fa-users'); return; }
  tb.innerHTML = list.map(u => {
    const active = u.is_active !== false;
    const grp = (u.groups||[]).join(', ') || '—';
    const full = ((u.first_name||'')+' '+(u.last_name||'')).trim() || '—';
    return `<tr>
      <td><span class="fw-600">${escapeHtml(u.username)}</span></td>
      <td>${escapeHtml(full)}</td>
      <td><span class="badge primary">${escapeHtml(grp)}</span></td>
      <td><span class="badge ${active?'success':'danger'}">${active?I18n.t('lbl_active'):I18n.t('lbl_inactive')}</span></td>
      <td><div class="table-actions">
        <button class="btn btn-ghost btn-sm" onclick="showEdit(${u.id})" data-i18n-title="btn_edit"><i class="fas fa-pen"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="toggleStatus(${u.id})" style="color:${active?'var(--c-warning)':'var(--c-success)'};" data-i18n-title="${active?'usr_deactivate':'usr_activate'}"><i class="fas ${active?'fa-user-slash':'fa-user-check'}"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="del(${u.id})" style="color:var(--c-danger);" data-i18n-title="btn_delete"><i class="fas fa-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('');
}

function escapeHtml(s) { return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function showCreate() {
  const data = await UI.formModal({
    titleKey:'usr_new', width:480,
    html: `<div class="swal-form">
      <div class="field"><label class="label">${I18n.t('usr_username')} <span class="req">*</span></label>
        <input class="input" name="username" required></div>
      <div class="field"><label class="label">${I18n.t('usr_password')} <span class="req">*</span></label>
        <input class="input" type="password" name="password" required></div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('usr_first_name')}</label>
          <input class="input" name="first_name"></div>
        <div class="field"><label class="label">${I18n.t('usr_last_name')}</label>
          <input class="input" name="last_name"></div>
      </div>
      <div class="field"><label class="label">${I18n.t('usr_group')} <span class="req">*</span></label>
        <select class="select" name="group" required>
          <option value="Commercial">Commercial</option>
          <option value="Comptable">Comptable</option>
          <option value="Secrétaire">Secrétaire</option>
          <option value="Admin">Admin</option>
        </select></div>
    </div>`,
    preConfirm: (d) => ({
      username: d.username,
      password: d.password,
      first_name: d.first_name||'',
      last_name: d.last_name||'',
      groups: [d.group]
    })
  });
  if (!data) return;
  const r = await Auth.post(CFG.R.USER_CREATE, data);
  if (r?.ok) { UI.ok(I18n.t('usr_success_create')); await loadUsers(); }
  else await UI.apiErr(r);
}

async function showEdit(id) {
  const u = usersList.find(x => x.id === id);
  if (!u) return;
  const data = await UI.formModal({
    titleKey:'btn_edit', width:480,
    html: `<div class="swal-form">
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('usr_first_name')}</label>
          <input class="input" name="first_name" value="${escapeHtml(u.first_name||'')}"></div>
        <div class="field"><label class="label">${I18n.t('usr_last_name')}</label>
          <input class="input" name="last_name" value="${escapeHtml(u.last_name||'')}"></div>
      </div>
      <div class="field"><label class="label">${I18n.t('usr_pwd_optional')}</label>
        <input class="input" type="password" name="password" placeholder="••••••••"></div>
      <div class="field"><label class="label">${I18n.t('usr_group')}</label>
        <select class="select" name="group">
          ${['Commercial','Comptable','Secrétaire','Admin'].map(g =>
            `<option value="${g}" ${(u.groups||[]).includes(g)?'selected':''}>${g}</option>`
          ).join('')}
        </select></div>
    </div>`,
    preConfirm: (d) => {
      const body = {
        first_name: d.first_name||'',
        last_name: d.last_name||'',
        groups: [d.group]
      };
      if (d.password) body.password = d.password;
      return body;
    }
  });
  if (!data) return;
  const r = await Auth.put(CFG.R.USER_UPDATE(id), data);
  if (r?.ok) { UI.ok(I18n.t('usr_success_update')); await loadUsers(); }
  else await UI.apiErr(r);
}

async function toggleStatus(id) {
  const r = await Auth.fetch(CFG.R.USER_TOGGLE(id));
  if (r?.ok) { UI.ok(I18n.t('usr_success_toggle')); await loadUsers(); }
  else await UI.apiErr(r);
}

async function del(id) {
  if (!await UI.confirmDelete()) return;
  const r = await Auth.del(CFG.R.USER_DELETE(id));
  if (r?.ok) { UI.ok(I18n.t('usr_success_delete')); await loadUsers(); }
  else await UI.apiErr(r);
}
</script>
</body>
</html>

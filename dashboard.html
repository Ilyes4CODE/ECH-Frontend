<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-title="dash_title">Tableau de bord — ECH SAHARA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/app.css">
<style>
  .project-card {
    background:var(--c-surface);
    border:1px solid var(--c-border);
    border-radius:12px;
    padding:14px;
    transition:all .2s;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .project-card:hover {
    border-color:var(--c-primary);
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  .project-card .pn { font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:6px;display:flex;align-items:center;gap:8px; }
  .project-card .pd { font-size:12px;color:var(--c-text-2);margin-bottom:10px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; }
  .project-card .pmeta { display:flex;gap:10px;font-size:11.5px;color:var(--c-text-2); }
  .project-card .pmeta span { display:inline-flex;align-items:center;gap:4px; }
  .quick-link {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:14px 10px;
    border:1px solid var(--c-border);
    border-radius:10px;
    text-decoration:none;
    color:var(--c-text);
    transition:all .2s;
    background:var(--c-surface);
  }
  .quick-link:hover {
    border-color:var(--c-primary);
    background:var(--c-primary-bg);
    color:var(--c-primary);
    transform:translateY(-1px);
  }
  .quick-link i { font-size:18px; }
  .quick-link span { font-size:12px;font-weight:500; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="content">

      <div class="page-head">
        <div>
          <h2 data-i18n="dash_title">Tableau de bord</h2>
          <p class="sub" data-i18n="lbl_overview">Vue d'ensemble de votre activité</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat featured">
          <div class="stat-row">
            <div>
              <div class="stat-label" data-i18n="dash_caisse">Solde de caisse</div>
              <div class="stat-value" id="s-caisse">—</div>
              <div class="stat-sub" id="s-caisse-date"></div>
            </div>
            <div class="stat-icon"><i class="fas fa-cash-register"></i></div>
          </div>
          <div class="stat-actions">
            <button class="mini-btn" onclick="showEncaissement()"><i class="fas fa-plus"></i> <span data-i18n="dash_encaisser">Encaisser</span></button>
            <button class="mini-btn" onclick="showDecaissement()"><i class="fas fa-minus"></i> <span data-i18n="dash_decaisser">Décaisser</span></button>
          </div>
        </div>

        <div class="stat">
          <div class="stat-row">
            <div>
              <div class="stat-label" data-i18n="dash_projects">Projets</div>
              <div class="stat-value" id="s-projects">—</div>
            </div>
            <div class="stat-icon primary"><i class="fas fa-diagram-project"></i></div>
          </div>
        </div>

        <div class="stat">
          <div class="stat-row">
            <div>
              <div class="stat-label" data-i18n="dash_dettes">Dettes actives</div>
              <div class="stat-value" id="s-dettes">—</div>
            </div>
            <div class="stat-icon danger"><i class="fas fa-hand-holding-dollar"></i></div>
          </div>
        </div>

        <div class="stat">
          <div class="stat-row">
            <div>
              <div class="stat-label" data-i18n="dash_benefices">Bénéfices</div>
              <div class="stat-value" id="s-benefices">—</div>
            </div>
            <div class="stat-icon success"><i class="fas fa-arrow-trend-up"></i></div>
          </div>
        </div>
      </div>

      <div class="card mb-3" style="margin-bottom:24px;">
        <div class="card-head"><h3 data-i18n="dash_quick">Accès rapide</h3></div>
        <div class="card-body">
          <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr));">
            <a href="caisse.html" class="quick-link"><i class="fas fa-cash-register text-primary"></i><span data-i18n="nav_caisse">Caisse</span></a>
            <a href="bon-livraison.html" class="quick-link"><i class="fas fa-truck-fast" style="color:#0EA5E9;"></i><span data-i18n="nav_bl">BL</span></a>
            <a href="bon-commande.html" class="quick-link"><i class="fas fa-file-invoice text-accent"></i><span data-i18n="nav_bc">BC</span></a>
            <a href="ordre-mission.html" class="quick-link"><i class="fas fa-plane-departure" style="color:#7C3AED;"></i><span data-i18n="nav_missions">Missions</span></a>
            <a href="dettes.html" class="quick-link"><i class="fas fa-hand-holding-dollar text-danger"></i><span data-i18n="nav_dettes">Dettes</span></a>
            <a href="accreances.html" class="quick-link"><i class="fas fa-arrow-trend-up text-success"></i><span data-i18n="nav_accreances">Accréances</span></a>
          </div>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="card-head">
            <h3 data-i18n="dash_my_projects">Mes projets</h3>
            <button class="btn btn-primary btn-sm" onclick="showNewProject()">
              <i class="fas fa-plus"></i> <span data-i18n="dash_new_project">Nouveau</span>
            </button>
          </div>
          <div class="card-body" id="projectsBox" style="max-height:480px;overflow-y:auto;">
            <div class="loader-wrap"><div class="loader"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 data-i18n="dash_recent_ops">Opérations récentes</h3>
            <a href="caisse.html" class="btn btn-ghost btn-sm"><span data-i18n="dash_see_all">Tout voir</span> <i class="fas fa-arrow-right"></i></a>
          </div>
          <div class="table-scroll">
            <table class="table">
              <thead><tr>
                <th data-i18n="lbl_type">Type</th>
                <th data-i18n="lbl_amount">Montant</th>
                <th data-i18n="lbl_project">Projet</th>
                <th data-i18n="lbl_date">Date</th>
              </tr></thead>
              <tbody id="opsBody">
                <tr><td colspan="4"><div class="loader-wrap" style="padding:30px;"><div class="loader"></div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
let projects = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!UI.init('nav_dashboard','dash_title')) return;
  I18n.init();
  await Promise.all([loadStats(), loadProjects(), loadRecentOps()]);
});

async function loadStats() {
  try {
    const d = await Auth.get(CFG.R.DASHBOARD);
    document.getElementById('s-caisse').textContent    = UI.fmtAmount(d.caisse_balance);
    document.getElementById('s-projects').textContent  = d.total_projects ?? '—';
    document.getElementById('s-dettes').textContent    = d.active_dettes ?? '—';
    document.getElementById('s-benefices').textContent = UI.fmtAmount(d.total_benefices);
  } catch(e) { console.error(e); }
}

async function loadProjects() {
  const box = document.getElementById('projectsBox');
  try {
    projects = await Auth.get(CFG.R.PROJECTS);
    if (!projects.length) {
      box.innerHTML = `<div class="table-empty"><i class="fas fa-diagram-project"></i><p data-i18n="dash_no_projects">${I18n.t('dash_no_projects')}</p></div>`;
      return;
    }
    box.innerHTML = `<div class="grid" style="grid-template-columns:1fr;gap:10px;">
      ${projects.map(p => `
        <a href="project-detail.html?id=${p.id}" class="project-card">
          <div class="pn"><i class="fas fa-folder text-accent"></i> ${escapeHtml(p.name)}</div>
          <div class="pd">${escapeHtml(p.description||'')}</div>
          <div class="pmeta">
            <span class="text-danger"><i class="fas fa-arrow-down"></i> ${UI.fmtAmount(p.total_depenses)}</span>
            <span class="text-success"><i class="fas fa-arrow-up"></i> ${UI.fmtAmount(p.total_accreance)}</span>
          </div>
        </a>
      `).join('')}
    </div>`;
  } catch(e) {
    box.innerHTML = `<div class="table-empty"><i class="fas fa-circle-exclamation text-danger"></i><p>${I18n.t('err_load')}</p></div>`;
  }
}

async function loadRecentOps() {
  const tb = document.getElementById('opsBody');
  try {
    const d = await Auth.get(CFG.R.CAISSE_HISTORY + '?page_size=6&ordering=-created_at');
    const ops = d.results || d;
    if (!ops.length) { tb.innerHTML = UI.emptyRow(4, 'fa-clock'); return; }
    tb.innerHTML = ops.map(o => `<tr>
      <td><span class="badge ${o.action==='encaissement'?'success':'danger'}">
        <i class="fas fa-arrow-${o.action==='encaissement'?'down':'up'}"></i>
        ${o.action==='encaissement'?I18n.t('caisse_encaissement'):I18n.t('caisse_decaissement')}
      </span></td>
      <td class="fw-600">${UI.fmtAmount(o.amount)}</td>
      <td>${o.project?.name||'—'}</td>
      <td style="color:var(--c-text-2);font-size:12.5px;">${UI.fmtDate(o.date||o.created_at)}</td>
    </tr>`).join('');
  } catch(e) {
    tb.innerHTML = UI.emptyRow(4, 'fa-circle-exclamation', 'err_load');
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function payFieldsHTML(prefix) {
  return `
    <div class="form-row cols-2" id="${prefix}-pay-extra" style="display:none;">
      <div class="field"><label class="label">${I18n.t('caisse_fournisseur')}</label><input class="input" name="nom_fournisseur"></div>
      <div class="field"><label class="label" id="${prefix}-pay-extra-lbl">${I18n.t('caisse_cheque')}</label><input class="input" name="bank_ref"></div>
    </div>`;
}

async function showEncaissement() {
  const projOpts = projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const data = await UI.formModal({
    titleKey:'enc_title', width:520,
    html: `<div class="swal-form">
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('enc_amount')} <span class="req">*</span></label>
          <input class="input" type="number" name="amount" min="0.01" step="0.01" required></div>
        <div class="field"><label class="label">${I18n.t('lbl_date')} <span class="req">*</span></label>
          <input class="input" type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field">
        <label class="label">${I18n.t('enc_source')}</label>
        <select class="select" name="income_source" id="enc-source" onchange="toggleEncSrc(this.value)">
          <option value="projet">${I18n.t('caisse_source_projet')}</option>
          <option value="dette">${I18n.t('caisse_source_dette')}</option>
          <option value="collaborator">${I18n.t('caisse_source_collab')}</option>
          <option value="autre">${I18n.t('caisse_source_autre')}</option>
        </select>
      </div>
      <div class="field" id="enc-project-f"><label class="label">${I18n.t('lbl_project')}</label>
        <select class="select" name="project_id"><option value="">—</option>${projOpts}</select></div>
      <div class="field" id="enc-creditor-f" style="display:none;"><label class="label">${I18n.t('enc_creditor')}</label>
        <input class="input" name="creditor_name"></div>
      <div class="field" id="enc-obs-f" style="display:none;"><label class="label">${I18n.t('caisse_observation')}</label>
        <textarea class="textarea" name="observation" rows="2"></textarea></div>
      <div class="field">
        <label class="label">${I18n.t('caisse_mode')}</label>
        <select class="select" name="mode_paiement" onchange="togglePay(this.value,'enc')">
          <option value="especes">${I18n.t('caisse_mode_especes')}</option>
          <option value="cheque">${I18n.t('caisse_mode_cheque')}</option>
          <option value="virement">${I18n.t('caisse_mode_virement')}</option>
        </select>
      </div>
      ${payFieldsHTML('enc')}
      <div class="field"><label class="label">${I18n.t('lbl_description')}</label>
        <textarea class="textarea" name="description" rows="2"></textarea></div>
    </div>`,
    preConfirm: (d) => {
      const body = {
        amount: parseFloat(d.amount),
        date: d.date,
        description: d.description||'',
        income_source: d.income_source,
        mode_paiement: d.mode_paiement
      };
      if (d.project_id) body.project_id = parseInt(d.project_id);
      if (d.creditor_name) body.creditor_name = d.creditor_name;
      if (d.observation) body.observation = d.observation;
      if (d.nom_fournisseur) body.nom_fournisseur = d.nom_fournisseur;
      if (d.mode_paiement==='cheque') body.numero_cheque = d.bank_ref;
      if (d.mode_paiement==='virement') body.banque = d.bank_ref;
      return body;
    }
  });
  if (!data) return;
  const r = await Auth.post(CFG.R.ENCAISSEMENT, data);
  if (r?.ok) { UI.ok(I18n.t('enc_success')); await Promise.all([loadStats(), loadRecentOps()]); }
  else await UI.apiErr(r);
}

async function showDecaissement() {
  if (!projects.length) {
    UI.warn(I18n.t('dash_no_projects'));
    return;
  }
  const projOpts = projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const data = await UI.formModal({
    titleKey:'dec_title', width:520,
    html: `<div class="swal-form">
      <div class="field"><label class="label">${I18n.t('dec_project')} <span class="req">*</span></label>
        <select class="select" name="project_id" required><option value="">—</option>${projOpts}</select></div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('enc_amount')} <span class="req">*</span></label>
          <input class="input" type="number" name="amount" min="0.01" step="0.01" required></div>
        <div class="field"><label class="label">${I18n.t('lbl_date')} <span class="req">*</span></label>
          <input class="input" type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label class="label">${I18n.t('caisse_mode')}</label>
        <select class="select" name="mode_paiement" onchange="togglePay(this.value,'enc')">
          <option value="especes">${I18n.t('caisse_mode_especes')}</option>
          <option value="cheque">${I18n.t('caisse_mode_cheque')}</option>
          <option value="virement">${I18n.t('caisse_mode_virement')}</option>
        </select></div>
      ${payFieldsHTML('enc')}
      <div class="field"><label class="label">${I18n.t('lbl_description')}</label>
        <textarea class="textarea" name="description" rows="2"></textarea></div>
    </div>`,
    preConfirm: (d) => {
      const body = {
        project_id: parseInt(d.project_id),
        amount: parseFloat(d.amount),
        date: d.date,
        description: d.description||'',
        mode_paiement: d.mode_paiement
      };
      if (d.nom_fournisseur) body.nom_fournisseur = d.nom_fournisseur;
      if (d.mode_paiement==='cheque') body.numero_cheque = d.bank_ref;
      if (d.mode_paiement==='virement') body.banque = d.bank_ref;
      return body;
    }
  });
  if (!data) return;
  const r = await Auth.post(CFG.R.DECAISSEMENT, data);
  if (r?.ok) { UI.ok(I18n.t('dec_success')); await Promise.all([loadStats(), loadRecentOps()]); }
  else await UI.apiErr(r);
}

function toggleEncSrc(v) {
  document.getElementById('enc-project-f').style.display  = (v==='projet'||v==='collaborator') ? '' : 'none';
  document.getElementById('enc-creditor-f').style.display = v==='dette' ? '' : 'none';
  document.getElementById('enc-obs-f').style.display      = v==='autre' ? '' : 'none';
}
function togglePay(mode, prefix) {
  const wrap = document.getElementById(`${prefix}-pay-extra`);
  if (!wrap) return;
  wrap.style.display = mode==='especes' ? 'none' : 'grid';
  const lbl = document.getElementById(`${prefix}-pay-extra-lbl`);
  if (lbl) lbl.textContent = mode==='cheque' ? I18n.t('caisse_cheque') : I18n.t('caisse_banque');
}

async function showNewProject() {
  const data = await UI.formModal({
    titleKey:'proj_new', width:520,
    html: `<div class="swal-form">
      <div class="field"><label class="label">${I18n.t('proj_name')} <span class="req">*</span></label>
        <input class="input" name="name" required></div>
      <div class="field"><label class="label">${I18n.t('proj_description')} <span class="req">*</span></label>
        <textarea class="textarea" name="description" rows="2" required></textarea></div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('proj_budget')} <span class="req">*</span></label>
          <input class="input" type="number" name="estimated_budget" min="0" step="0.01" required></div>
        <div class="field"><label class="label">${I18n.t('proj_duration')} <span class="req">*</span></label>
          <input class="input" type="number" name="period_months" min="1" required value="12"></div>
      </div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('proj_start')} <span class="req">*</span></label>
          <input class="input" type="date" name="date_debut" required value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label class="label">${I18n.t('proj_collaborator')}</label>
          <input class="input" name="collaborator_name"></div>
      </div>
      <div class="form-row cols-2">
        <div class="field"><label class="label">${I18n.t('proj_operation')}</label>
          <input class="input" name="operation"></div>
        <div class="field"><label class="label">${I18n.t('proj_numero_op')}</label>
          <input class="input" name="numero_operation"></div>
      </div>
    </div>`,
    preConfirm: (d) => ({
      name: d.name,
      description: d.description,
      estimated_budget: parseFloat(d.estimated_budget),
      period_months: parseInt(d.period_months),
      date_debut: d.date_debut,
      collaborator_name: d.collaborator_name || '',
      operation: d.operation || '',
      numero_operation: d.numero_operation || ''
    })
  });
  if (!data) return;
  const r = await Auth.post(CFG.R.PROJECT_CREATE, data);
  if (r?.ok) { UI.ok(I18n.t('proj_success_create')); await Promise.all([loadProjects(), loadStats()]); }
  else await UI.apiErr(r);
}
</script>
</body>
</html>
